name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart: [foodmission, observability]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Add Helm repos
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo update

      - name: Build dependencies — ${{ matrix.chart }}
        run: helm dep build charts/${{ matrix.chart }}

      - name: Lint — ${{ matrix.chart }}
        run: helm lint charts/${{ matrix.chart }}

  helm-template:
    name: Helm Template + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Add Helm repos
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo update

      - name: Build dependencies — foodmission
        run: helm dep build charts/foodmission

      - name: Build dependencies — observability
        run: helm dep build charts/observability

      - name: Template + validate — foodmission (test)
        run: |
          helm template foodmission charts/foodmission \
            -f charts/foodmission/values.yaml \
            -f charts/foodmission/test.values.yaml \
            | kubeconform \
              --strict \
              --ignore-missing-schemas \
              --kubernetes-version 1.32.0 \
              --summary

      - name: Template + validate — foodmission (staging)
        run: |
          helm template foodmission charts/foodmission \
            -f charts/foodmission/values.yaml \
            -f charts/foodmission/staging.values.yaml \
            | kubeconform \
              --strict \
              --ignore-missing-schemas \
              --kubernetes-version 1.32.0 \
              --summary

      - name: Template + validate — foodmission (prod)
        run: |
          helm template foodmission charts/foodmission \
            -f charts/foodmission/values.yaml \
            -f charts/foodmission/prod.values.yaml \
            | kubeconform \
              --strict \
              --ignore-missing-schemas \
              --kubernetes-version 1.32.0 \
              --summary

      - name: Template + validate — observability
        run: |
          helm template observability charts/observability \
            -f charts/observability/values.yaml \
            | kubeconform \
              --strict \
              --ignore-missing-schemas \
              --kubernetes-version 1.32.0 \
              --summary

  trivy-config:
    name: Trivy Config Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Add Helm repos
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo update

      - name: Build dependencies — foodmission
        run: helm dep build charts/foodmission

      - name: Build dependencies — observability
        run: helm dep build charts/observability

      - name: Render manifests — all environments
        run: |
          mkdir -p rendered
          helm template foodmission charts/foodmission -f charts/foodmission/values.yaml -f charts/foodmission/test.values.yaml > rendered/foodmission-test.yaml
          helm template foodmission charts/foodmission -f charts/foodmission/values.yaml -f charts/foodmission/staging.values.yaml > rendered/foodmission-staging.yaml
          helm template foodmission charts/foodmission -f charts/foodmission/values.yaml -f charts/foodmission/prod.values.yaml > rendered/foodmission-prod.yaml
          helm template foodmission charts/foodmission -f charts/foodmission/values.yaml -f charts/foodmission/preview.values.yaml > rendered/foodmission-preview.yaml
          helm template observability charts/observability -f charts/observability/values.yaml > rendered/observability.yaml

      # Report-only for now: surfaces misconfigs (missing resource limits, privileged
      # containers, etc.) in the PR checks summary without blocking merge. Flip
      # exit-code to 1 once the existing findings are triaged and this should gate.
      - name: Trivy config scan — rendered manifests
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: config
          scan-ref: rendered/
          severity: CRITICAL,HIGH
          exit-code: "0"

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks/gitleaks-action@v2 now requires a paid GITLEAKS_LICENSE for
      # org-owned repos - run the OSS CLI directly instead, license-free.
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --config /repo/.gitleaks.toml --redact -v --exit-code 1