name: Image CVE Scan

# Scheduled, not per-PR: the two images below are built and pushed by other
# repos (foodmission-data-framework, foodmission-keycloak) and float on
# latest/main tags — new CVEs can appear without any change here, so a PR
# gate wouldn't catch them. This job fails the run (visible red X in Actions)
# when a CRITICAL/HIGH CVE is found, so it stays a passive check you notice,
# not a report that has to be manually opened.
on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

jobs:
  image-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ghcr.io/reedu-reengineering-education/foodmission-data-framework:latest
          - ghcr.io/reedu-reengineering-education/foodmission-keycloak:main
    steps:
      - name: Trivy image scan — ${{ matrix.image }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          severity: CRITICAL,HIGH
          exit-code: "1"
