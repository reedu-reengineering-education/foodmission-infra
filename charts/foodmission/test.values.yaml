# Test environment

global:
  namespace: foodmission-test
  environment: test
  tlsSecret: foodmission-tls-cert-test
  cnpg:
    clusterName: foodmission-pg-test

cnpg:
  instances: 2
  storageSize: 5Gi
  monitoring: true

  # Bootstrap from staging backup (uncomment when needed, then re-comment after restore)
  # bootstrap:
  #   recovery:
  #     source: staging-cluster
  # externalClusters:
  #   - name: staging-cluster
  #     barmanObjectStore:
  #       destinationPath: s3://foodmission-staging/backups
  #       endpointURL: https://hel1.your-objectstorage.com
  #       s3Credentials:
  #         accessKeyId:
  #           name: foodmission-pg-s3-credentials
  #           key: ACCESS_KEY_ID
  #         secretAccessKey:
  #           name: foodmission-pg-s3-credentials
  #           key: ACCESS_SECRET_KEY
  #       wal:
  #         compression: gzip

api:
  image: ghcr.io/reedu-reengineering-education/foodmission-data-framework:0.4.2
  hostname: test.api.foodmission.eu
  replicaCount: 2
  extraEnv:
    - name: MONGODB_OFF_URL
      value: "mongodb://admin:TestPassword123@mongodb-service.off-test.svc.cluster.local:27017/off?authSource=admin"
  translations:
    enabled: true
  logging:
    level: debug
  opentelemetry:
    enabled: "true"

dashboard:
  enabled: true
  image: ghcr.io/reedu-reengineering-education/foodmission-data-ui:0.1.0
  hostname: test.data.foodmission.eu

keycloak:
  image: ghcr.io/reedu-reengineering-education/foodmission-keycloak:0.1.2
  hostname: test.auth.foodmission.eu

smtp:
  fromName: FOODMISSION Test
