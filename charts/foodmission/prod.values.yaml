# Production environment

global:
  namespace: foodmission-prod
  tlsSecret: foodmission-tls-cert-prod
  cnpg:
    clusterName: foodmission-pg-prod

cnpg:
  instances: 3
  storageSize: 50Gi

  backup:
    enabled: true
    barmanStoreName: foodmission-backup-store
    destinationPath: s3://foodmission-production/backups/foodmission-pg-prod
    endpointURL: https://hel1.your-objectstorage.com

  scheduledBackup:
    enabled: true

  # Bootstrap from existing backup
  bootstrap:
    recovery:
      source: foodmission-prod-backup-cluster

  # Define the external cluster (the backup source)
  externalClusters:
    - name: foodmission-prod-backup-cluster
      barmanObjectStore:
        destinationPath: s3://foodmission-production/backups/foodmission-pg
        endpointURL: https://hel1.your-objectstorage.com
        s3Credentials:
          accessKeyId:
            name: foodmission-secrets
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: foodmission-secrets
            key: ACCESS_SECRET_KEY
        wal:
          compression: gzip

api:
  image: ghcr.io/reedu-reengineering-education/foodmission-data-framework:sha-5deb1c2
  replicaCount: 3
  opentelemetry:
    enabled: "true"

keycloak:
  image: ghcr.io/reedu-reengineering-education/foodmission-keycloak:0.1.0
  replicaCount: 2
