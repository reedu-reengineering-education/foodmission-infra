# FOODMISSION — default values
# Override per environment in values-test.yaml / values-staging.yaml / values-prod.yaml
# Secrets are managed via SealedSecrets (see secrets/*.sealed.yaml)

# ---------------------------------------------------------------------------
# Global
# ---------------------------------------------------------------------------
global:
  namespace: foodmission
  environment: production
  tlsSecret: foodmission-tls-cert
  cnpg:
    clusterName: foodmission-pg
    database: foodmission
    owner: foodmission_user

# ---------------------------------------------------------------------------
# CloudNativePG (PostgreSQL)
# ---------------------------------------------------------------------------
cnpg:
  enabled: true
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.3
  secretName: foodmission-secrets
  storageSize: 10Gi
  storageClass: ""
  monitoring: true

  # Postgres container resources. Requests make the DB visible to the
  # scheduler and cluster-autoscaler; without them pods are BestEffort.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  # PodDisruptionBudget on the primary. With instances: 1 it blocks
  # `kubectl drain` and autoscaler scale-down forever — disable there.
  enablePDB: true

  # Seconds Postgres waits for clients to disconnect before a fast
  # shutdown. Unset = CNPG default (180).
  # smartShutdownTimeout: 180

  backup:
    enabled: false
    barmanStoreName: foodmission-backup-store
    destinationPath: ""
    s3Secret: foodmission-secrets
    endpointURL: ""
    retentionPolicy: 30d

  scheduledBackup:
    enabled: false
    schedule: "0 0 2 * * *"

# ---------------------------------------------------------------------------
# PostgreSQL managed databases and roles (used by cnpg-cluster & Database CRDs)
# ---------------------------------------------------------------------------
postgresql:
  managed:
    databases:
      - name: foodmission
        owner: foodmission_user
        ensure: present
      - name: keycloak
        owner: foodmission_user
        ensure: present
    roles:
      - name: foodmission_user
        login: true
        superuser: false
        passwordSecret:
          name: foodmission-secrets

# ---------------------------------------------------------------------------
# cert-manager ClusterIssuer (enable only on first install)
# ---------------------------------------------------------------------------
clusterIssuer:
  enabled: false
  email: admin@foodmission.eu
  server: https://acme-v02.api.letsencrypt.org/directory

# ---------------------------------------------------------------------------
# API
# ---------------------------------------------------------------------------
api:
  image: ghcr.io/reedu-reengineering-education/foodmission-data-framework:latest
  hostname: api.foodmission.eu
  extraEnv: []  # additional env vars to override sealed secret values (e.g. for PR previews)
  replicaCount: 2

  # CPU-based HorizontalPodAutoscaler. When enabled, replicaCount is ignored
  # and the HPA owns spec.replicas. Needs metrics-server (bundled with k3s).
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

  translations:
    enabled: false  # runs `npm run db:translations` as a post-upgrade hook job; enable per-env

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  logging:
    level: info
    console: "true"
    file: "true"

  opentelemetry:
    enabled: "false"
    endpoint: http://observability-opentelemetry-collector.observability.svc.cluster.local:4318

# ---------------------------------------------------------------------------
# Keycloak
# ---------------------------------------------------------------------------
keycloak:
  image: ghcr.io/reedu-reengineering-education/foodmission-keycloak:main
  hostname: auth.foodmission.eu
  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

  admin:
    user: admin

# ---------------------------------------------------------------------------
# Valkey (Redis-compatible cache, Valkey is the MIT-licensed Redis successor)
# ---------------------------------------------------------------------------
valkey:
  enabled: false
  architecture: standalone
  auth:
    enabled: false
  primary:
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        memory: 128Mi
    persistence:
      enabled: false
