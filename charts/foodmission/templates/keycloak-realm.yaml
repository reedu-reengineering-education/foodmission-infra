{{- /* Realm config - uses ${ENV_VAR} placeholders resolved by Keycloak at import time */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-keycloak-realm
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/component: keycloak
data:
  realm.json: |-
{{ .Files.Get "files/foodmission-realm.production.json" | indent 4 }}
