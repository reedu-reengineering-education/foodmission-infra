# PR preview environment
# Hostnames, namespace, and clusterName are injected via ApplicationSet parameters.

global:
  environment: preview

cnpg:
  instances: 1
  storageSize: 1Gi
  monitoring: false
  # Single instance: a primary PDB would block every node drain.
  enablePDB: false
  # Don't wait 3 min for app connection pools to close on restart/drain.
  smartShutdownTimeout: 10
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  backup:
    enabled: false
  scheduledBackup:
    enabled: false

api:
  image: ghcr.io/reedu-reengineering-education/foodmission-data-framework:sha-a22e18f
  replicaCount: 1
  extraEnv:
    - name: MONGODB_OFF_URL
      value: "mongodb://admin:TestPassword123@mongodb-service.off-test.svc.cluster.local:27017/?authSource=admin"
  translations:
    enabled: true
  logging:
    level: debug

keycloak:
  image: ghcr.io/reedu-reengineering-education/foodmission-keycloak:0.1.2
