apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  # GitHub service — token stored in argocd-notifications-secret key "github-token"
  service.github: |
    token: $github-token

  # Template posted as a PR comment when the preview deploy is healthy
  template.preview-ready: |
    message: |
      🚀 **Deploy preview is ready!**

      | Service | URL |
      |---------|-----|
      | API | https://pr-{{index (splitList "-" .app.metadata.name) 2}}.api.foodmission.eu |
      | Auth | https://pr-{{index (splitList "-" .app.metadata.name) 2}}.auth.foodmission.eu |
    github:
      repoURLPath: "{{(index .app.spec.sources 0).repoURL}}"
      revisionPath: "{{index .app.status.sync.revisions 0}}"

  # Trigger: fire once the app transitions to Healthy after a successful sync
  trigger.on-preview-ready: |
    - when: app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
      oncePer: app.status.operationState.syncResult.revisions[0]
      send: [preview-ready]
