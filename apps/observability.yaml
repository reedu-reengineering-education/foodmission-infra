apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
spec:
  project: foodmission

  sources:
    # Helm chart
    - repoURL: https://github.com/reedu-reengineering-education/foodmission-infra.git
      targetRevision: main
      path: charts/observability
      helm:
        valueFiles:
          - values.yaml
    # SealedSecrets (Grafana admin credentials)
    - repoURL: https://github.com/reedu-reengineering-education/foodmission-infra.git
      targetRevision: main
      path: secrets
      directory:
        include: 'grafana-admin.sealed.yaml'

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # needed for large CRDs (Prometheus rules etc.)
