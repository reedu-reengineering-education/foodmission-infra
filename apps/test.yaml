apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: foodmission-test
  namespace: argocd
spec:
  project: foodmission

  sources:
    # Helm chart
    - repoURL: git@github.com:reedu-reengineering-education/foodmission-infra.git
      targetRevision: main
      path: charts/foodmission
      helm:
        valueFiles:
          - values.yaml
          - test.values.yaml
    # SealedSecrets
    - repoURL: git@github.com:reedu-reengineering-education/foodmission-infra.git
      targetRevision: main
      path: secrets
      directory:
        include: 'test.sealed.yaml'

  destination:
    server: https://kubernetes.default.svc
    namespace: foodmission-test

  syncPolicy:
    automated:
      prune: false     # protect database from accidental deletion
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
