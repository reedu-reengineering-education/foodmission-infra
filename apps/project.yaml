apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: foodmission
  namespace: argocd
spec:
  description: FOODMISSION infrastructure

  sourceRepos:
    - https://github.com/reedu-reengineering-education/foodmission-infra.git

  destinations:
    - namespace: foodmission-test
      server: https://kubernetes.default.svc
    - namespace: foodmission-staging
      server: https://kubernetes.default.svc
    - namespace: foodmission-prod
      server: https://kubernetes.default.svc
    - namespace: observability
      server: https://kubernetes.default.svc

  # Allow creating cluster-wide resources (Namespace, ClusterIssuer, RBAC, CRDs)
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
